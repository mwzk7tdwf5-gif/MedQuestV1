<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0920"><title>MedQuest</title><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet"><style>:root{--bg:#0b0920;--panel:#17123b;--ink:#efeaff;--mute:#a59fd6;--blue:#3aa0ff;--green:#3ddc84;--gold:#ffc83d;--purple:#b45cff;--red:#ff5a6e;--pink:#ff5fb0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px 'Pixelify Sans',monospace;background-image:radial-gradient(2px 2px at 22px 34px,#ffffff80,transparent);background-size:180px 160px}header{position:sticky;top:0;background:#07051a;border-bottom:3px solid var(--blue);padding:12px;z-index:3}header>div,main{max-width:620px;margin:auto}main{padding:18px 12px 100px}.hudrow,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hudrow>div:nth-child(2){flex:1}.panel{border:3px solid var(--c,var(--blue));border-radius:6px;background:linear-gradient(#1b1648,var(--panel));padding:15px;margin-bottom:16px;box-shadow:0 0 18px #0008}h1{font:28px 'Press Start 2P',monospace;color:var(--pink);text-align:center;margin:8px 0}h2{font:11px/1.7 'Press Start 2P',monospace;color:var(--c,var(--blue));margin:0 0 14px}p{margin:8px 0}small,.mute{color:var(--mute)}.bar{background:#08061c;border:2px solid #000;height:20px;position:relative;margin:6px 0}.bar i{display:block;background:var(--c,var(--blue));height:100%}.bar span{position:absolute;inset:0;text-align:center;font-size:14px;color:white;text-shadow:1px 1px #000}.btn{border:0;background:var(--c,var(--gold));color:#130c27;font:10px/1.5 'Press Start 2P',monospace;padding:13px;min-height:44px;cursor:pointer;border-radius:4px;box-shadow:0 4px #0008}.btn:disabled{opacity:.4}input,select{min-width:0;flex:1;padding:11px;background:#08061c;border:2px solid #393174;color:white;border-radius:4px;font:17px 'Pixelify Sans',monospace;min-height:44px}input[type=checkbox]{flex:0;width:23px;height:23px;min-height:23px;accent-color:var(--green)}form{display:grid;gap:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#07051a;border-top:3px solid var(--purple);display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{background:transparent;border:0;color:var(--mute);padding:10px 2px;min-height:58px;font:9px 'Pixelify Sans',monospace;cursor:pointer}nav button b{display:block;font-size:24px}nav button.active{color:var(--gold);background:#ffffff10}.item{padding:12px 0;border-bottom:1px dashed #393174}.item:last-child{border:0}.item .row{justify-content:space-between}.clock{text-align:center;font:34px 'Press Start 2P',monospace;padding:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.skin{border:2px solid #393174;padding:12px;text-align:center}.skin.active{border-color:var(--gold)}.center{text-align:center}.logo{font-size:48px}details summary{cursor:pointer;font-size:23px;font-weight:bold}button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}@media(max-width:380px){h1{font-size:23px}.btn{font-size:9px}}</style></head><body><header id="hud"></header><main id="app"></main><nav id="nav"></nav><script>
(()=>{'use strict';const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,10),day=()=>new Date().toLocaleDateString('sv-SE'),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaults=()=>({xp:0,coins:0,last:'',streak:0,best:0,subjects:[{id:id(),name:'Anatomie',topics:['Bewegungsapparat','Herz & Kreislauf','Kopf & Hals','Neuroanatomie'].map(name=>({id:id(),name,done:false}))},{id:id(),name:'Physiologie',topics:['Herz-Kreislauf','Niere & Säure-Base','Atmung','Nervensystem'].map(name=>({id:id(),name,done:false}))},{id:id(),name:'Biochemie',topics:['Aminosäuren & Proteine','Kohlenhydratstoffwechsel','Lipide','Enzyme'].map(name=>({id:id(),name,done:false}))}],sessions:[],questions:[],exams:[],rewards:[{id:id(),lvl:5,text:'Film- oder Serienabend'},{id:id(),lvl:10,text:'Neues Buch oder Leckerli'},{id:id(),lvl:15,text:'Freier Tag für ein Hobby'}],skin:'student',owned:['student'],timer:null,quests:{},xpDays:{},topicDays:{}});let S;try{S=JSON.parse(localStorage.getItem('medquest.standalone'))||defaults()}catch{S=defaults()}let tab='home';const save=()=>localStorage.setItem('medquest.standalone',JSON.stringify(S)),need=l=>100+25*l;function level(){let l=1,x=S.xp;while(x>=need(l)&&l<100){x-=need(l++);}return{l,x,max:need(l)}}const rank=l=>l>=30?'Approbation':l>=25?'Praktisches Jahr':l>=20?'Hammerexamen':l>=15?'Famulatur':l>=10?'Klinik':l>=5?'Physikum':'Vorklinik';function award(x){S.xp=Math.max(0,S.xp+x);S.coins=Math.max(0,S.coins+Math.trunc(x/10));S.xpDays[day()]=(S.xpDays[day()]||0)+x;if(x>0&&S.last!==day()){let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);S.streak=S.last===yesterday.toLocaleDateString('sv-SE')?S.streak+1:1;S.last=day();S.best=Math.max(S.best,S.streak)}}const sessions=()=>S.sessions.filter(s=>s.d===day()),minutes=()=>sessions().reduce((a,s)=>a+s.min,0),todayQ=()=>S.questions.filter(q=>q.d===day()).reduce((a,q)=>a+q.total,0),totalQ=()=>S.questions.reduce((a,q)=>a+q.total,0),correctQ=()=>S.questions.reduce((a,q)=>a+q.correct,0),topics=()=>S.subjects.flatMap(s=>s.topics),bar=(p,c,t)=>`<div class="bar" style="--c:${c}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i><span>${t}</span></div>`;function quests(){let q=[['2 Lernsessions',sessions().length,2,100],['20 Fragen kreuzen',todayQ(),20,80],['1 Thema abhaken',S.topicDays[day()]||0,1,70],['45 Minuten lernen',minutes(),45,100]];for(let i=0;i<q.length;i++)if(q[i][1]>=q[i][2]&&!S.quests[day()+i]){S.quests[day()+i]=true;award(q[i][3])}return q}function commit(){quests();save();render()}function hud(){const L=level();$('#hud').innerHTML=`<div class="hudrow"><div style="font-size:34px">👩‍⚕️</div><div><b style="color:var(--gold)">LVL ${L.l}</b> <small>${rank(L.l)}</small>${bar(L.x/L.max*100,'var(--blue)',`${L.x} / ${L.max} XP`)}</div><div>🪙 ${S.coins}<br>🔥 ${S.last===day()?S.streak:S.streak}</div></div>`}function home(){let q=quests(),t=topics(),done=t.filter(x=>x.done).length,next=S.exams.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date))[0];return `<h1>MedQuest</h1><p class="center" style="color:var(--gold)">Dein Medizinstudium als Abenteuer</p><section class="panel" style="--c:var(--purple)"><h2>Fokus-Session</h2>${S.timer?`<div class="clock" id="clock">--:--</div><button class="btn" data-action="cancel">Abbrechen</button><p class="mute">Der Countdown läuft nach Verlassen des Tabs weiter.</p>`:`<p class="mute">Sammle 2 XP pro Lernminute.</p><div class="row">${[15,25,50].map(m=>`<button class="btn" style="--c:var(--purple)" data-action="start" data-min="${m}">${m} Min</button>`).join('')}</div><form data-form="session" class="row" style="margin-top:15px"><input type="number" name="min" min="1" max="600" placeholder="Minuten nachtragen" required><button class="btn">Eintragen</button></form>`}<p class="mute">Heute: ${minutes()} Min · ${sessions().length} Sessions</p></section><section class="panel" style="--c:var(--gold)"><h2>Tägliche Quests</h2>${q.map((x,i)=>`<div class="item">${x[1]>=x[2]?'✅':'⬜'} ${x[0]} <small>${Math.min(x[1],x[2])}/${x[2]} · +${x[3]} XP</small></div>`).join('')}${bar((S.xpDays[day()]||0)/300*100,'var(--gold)',`Tagesziel ${S.xpDays[day()]||0} / 300 XP`)}</section><section class="panel" style="--c:var(--red)"><h2>Nächster Boss</h2>${next?`<b>👹 ${safe(next.name)}</b><p>${safe(next.date)}</p>`:'<p>Keine Prüfung geplant.</p><button class="btn" data-tab="bosses">Boss anlegen</button>'}</section><section class="panel" style="--c:var(--green)"><h2>Werte</h2><p>🧠 Wissen</p>${bar(t.length?done/t.length*100:0,'var(--blue)',`${done} von ${t.length} Themen`)}<p>🎯 Fokus</p>${bar(minutes()/45*100,'var(--red)',`${minutes()} Min heute`)}<p>🛡️ Treffsicherheit</p>${bar(totalQ()?correctQ()/totalQ()*100:0,'var(--gold)',totalQ()?`${Math.round(correctQ()/totalQ()*100)} %`:'Noch keine Fragen')}<p>🔥 Ausdauer</p>${bar(S.streak/14*100,'var(--green)',`${S.streak} Tage Serie`)}</section><section class="panel" style="--c:var(--blue)"><h2>Weltkarte</h2><p class="center">🏕️ ─ 🌲 ─ ⛰️ ─ 🌋 ─ 🏰 ─ 👑</p><p class="mute">Dein Rang: ${rank(level().l)}</p></section>`}function subjects(){return `<section class="panel"><h2>Neues Fach</h2><form data-form="subject" class="row"><input name="name" maxlength="40" placeholder="z. B. Pathologie" required><button class="btn">Anlegen</button></form></section>${S.subjects.map(s=>`<section class="panel" style="--c:var(--green)"><details open><summary>${safe(s.name)}</summary>${bar(s.topics.length?s.topics.filter(t=>t.done).length/s.topics.length*100:0,'var(--green)',`${s.topics.filter(t=>t.done).length} / ${s.topics.length} Themen`)}${s.topics.map(t=>`<div class="item row"><label class="row" style="flex:1"><input type="checkbox" data-action="topic" data-sid="${s.id}" data-id="${t.id}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:var(--mute)':''}">${safe(t.name)}</span></label><button class="btn" data-action="delTopic" data-sid="${s.id}" data-id="${t.id}">✕</button></div>`).join('')}<form data-form="topic" class="row" style="margin-top:12px"><input type="hidden" name="sid" value="${s.id}"><input name="name" placeholder="Neues Thema" maxlength="60" required><button class="btn" style="--c:var(--green)">+</button></form><p class="mute">Abhaken = +40 XP</p><button class="btn" data-action="delSubject" data-id="${s.id}">Fach löschen</button></details></section>`).join('')}`}function quiz(){return `<section class="panel" style="--c:var(--pink)"><h2>Fragen eintragen</h2><form data-form="quiz"><div class="row"><input name="total" type="number" min="1" max="1000" placeholder="Gekreuzt" required><input name="correct" type="number" min="0" max="1000" placeholder="Richtig" required></div><select name="sid"><option value="">Fach (optional)</option>${S.subjects.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('')}</select><button class="btn" style="--c:var(--pink)">Eintragen</button></form><p class="mute">2 XP pro Frage, 1 XP zusätzlich pro richtiger Antwort.</p></section><section class="panel" style="--c:var(--gold)"><h2>Statistik</h2><p>${totalQ()} Fragen · ${totalQ()?Math.round(correctQ()/totalQ()*100):0} % richtig</p>${S.subjects.map(s=>{let a=S.questions.filter(q=>q.sid===s.id),n=a.reduce((v,q)=>v+q.total,0),c=a.reduce((v,q)=>v+q.correct,0);return n?`<p>${safe(s.name)}: ${n} Fragen</p>${bar(c/n*100,'var(--green)',`${Math.round(c/n*100)} % richtig`)}`:''}).join('')}${S.questions.length?'<button class="btn" data-action="undoQuiz">Letzten Eintrag zurücknehmen</button>':''}</section>`}function bosses(){return `<section class="panel" style="--c:var(--red)"><h2>Neuer Boss</h2><form data-form="exam"><input name="name" maxlength="60" placeholder="Prüfung" required><input name="date" type="date" required><select name="sid"><option value="">Kein Fach</option>${S.subjects.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('')}</select><button class="btn" style="--c:var(--red)">Boss anlegen</button></form></section><section class="panel" style="--c:var(--red)"><h2>Prüfungsbosse</h2>${S.exams.length?S.exams.map(e=>{let s=S.subjects.find(s=>s.id===e.sid),open=s?s.topics.filter(t=>!t.done).length:0;return `<div class="item"><b>${e.done?'💀':'👹'} ${safe(e.name)}</b><p class="mute">${safe(e.date)} ${e.done?'· Besiegt':''}</p>${s?bar(s.topics.length?open/s.topics.length*100:0,'var(--red)',`${open} Themen offen`):''}<div class="row">${!e.done?`<button class="btn" style="--c:var(--green)" data-action="defeat" data-id="${e.id}">Besiegt +300 XP</button>`:''}<button class="btn" data-action="delExam" data-id="${e.id}">Löschen</button></div></div>`}).join(''):'<p>Keine Prüfungen eingetragen.</p>'}</section>`}const skins={student:['Studi-Hoodie',0,1,'🧑‍🎓'],kittel:['Weißer Kittel',120,1,'🥼'],op:['OP-Grün',250,5,'🩺'],notfall:['Notfall-Rot',400,10,'🚑'],gold:['Goldener Kittel',800,15,'👑']};function loot(){return `<section class="panel" style="--c:var(--gold)"><h2>Belohnungen</h2>${S.rewards.map(r=>`<div class="item row"><span>Lv ${r.lvl}: ${safe(r.text)}</span>${r.claimed?'✔ eingelöst':level().l>=r.lvl?`<button class="btn" data-action="claim" data-id="${r.id}">Einlösen</button>`:'🔒'}<button class="btn" data-action="delReward" data-id="${r.id}">✕</button></div>`).join('')}<form data-form="reward" style="margin-top:12px"><input name="lvl" type="number" min="1" max="99" placeholder="Ab Level" required><input name="text" maxlength="60" placeholder="Belohnung" required><button class="btn">Hinzufügen</button></form></section><section class="panel" style="--c:var(--purple)"><h2>Skins · 🪙 ${S.coins}</h2><div class="grid">${Object.entries(skins).map(([k,v])=>`<div class="skin ${S.skin===k?'active':''}"><div class="logo">${v[3]}</div><b>${v[0]}</b><p class="mute">${S.owned.includes(k)?'Freigeschaltet':`🪙 ${v[1]} · Lv ${v[2]}`}</p><button class="btn" data-action="skin" data-id="${k}" ${S.skin===k||(!S.owned.includes(k)&&(S.coins<v[1]||level().l<v[2]))?'disabled':''}>${S.skin===k?'Aktiv':S.owned.includes(k)?'Anziehen':'Kaufen'}</button></div>`).join('')}</div></section><section class="panel" style="--c:var(--red)"><h2>Neustart</h2><p class="mute">Fortschritt wird lokal in diesem Browser gespeichert.</p><button class="btn" style="--c:var(--red)" data-action="reset">Alles zurücksetzen</button></section>`}const views={home,subjects,quiz,bosses,loot},names=[['home','⚔️','Heute'],['subjects','📚','Fächer'],['quiz','✅','Kreuzen'],['bosses','👹','Bosse'],['loot','🎁','Schatz']];function render(){hud();$('#app').innerHTML=views[tab]();$('#nav').innerHTML=names.map(([k,i,n])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><b>${i}</b>${n}</button>`).join('');tick()}function finish(min){S.sessions.push({d:day(),min});award(min*2);commit()}function tick(){if(!S.timer)return;let ms=S.timer.end-Date.now();if(ms<=0){let m=S.timer.min;S.timer=null;finish(m);return}let el=$('#clock');if(el){let s=Math.ceil(ms/1000);el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}}setInterval(tick,1000);document.addEventListener('visibilitychange',tick);document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-action]');if(!b)return;let d=b.dataset;if(d.tab){tab=d.tab;render();scrollTo(0,0);return}let s=S.subjects.find(x=>x.id===d.sid),t=s?.topics.find(x=>x.id===d.id),ex=S.exams.find(x=>x.id===d.id);switch(d.action){case 'start':S.timer={min:+d.min,end:Date.now()+d.min*60000};break;case 'cancel':S.timer=null;break;case 'delTopic':if(s)s.topics=s.topics.filter(x=>x.id!==d.id);break;case 'delSubject':if(confirm('Fach löschen?'))S.subjects=S.subjects.filter(x=>x.id!==d.id);break;case 'undoQuiz':{let q=S.questions.pop();if(q)award(-q.xp);break}case 'defeat':if(ex&&!ex.done){ex.done=true;award(300)}break;case 'delExam':if(confirm('Boss löschen?'))S.exams=S.exams.filter(x=>x.id!==d.id);break;case 'claim':{let r=S.rewards.find(x=>x.id===d.id);if(r&&level().l>=r.lvl)r.claimed=true;break}case 'delReward':S.rewards=S.rewards.filter(x=>x.id!==d.id);break;case 'skin':{let k=skins[d.id];if(k){if(S.owned.includes(d.id))S.skin=d.id;else if(S.coins>=k[1]&&level().l>=k[2]){S.coins-=k[1];S.owned.push(d.id);S.skin=d.id}}break}case 'reset':if(confirm('Wirklich alle Daten löschen?')){S=defaults();tab='home'}break}commit()});document.addEventListener('change',e=>{let d=e.target.dataset;if(d.action!=='topic')return;let s=S.subjects.find(x=>x.id===d.sid),t=s?.topics.find(x=>x.id===d.id);if(!t)return;t.done=e.target.checked;if(t.done){S.topicDays[day()]=(S.topicDays[day()]||0)+1;award(40)}else{S.topicDays[day()]=Math.max(0,(S.topicDays[day()]||0)-1);award(-40)}commit()});document.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();let d=Object.fromEntries(new FormData(f));switch(f.dataset.form){case 'session':{let m=+d.min;if(m>=1&&m<=600)finish(m);return}case 'subject':if(d.name.trim())S.subjects.push({id:id(),name:d.name.trim(),topics:[]});break;case 'topic':{let s=S.subjects.find(x=>x.id===d.sid);if(s&&d.name.trim())s.topics.push({id:id(),name:d.name.trim(),done:false});break}case 'quiz':{let n=+d.total,c=+d.correct;if(!Number.isInteger(n)||!Number.isInteger(c)||n<1||n>1000||c<0||c>n){alert('Bitte gültige Fragezahlen eingeben.');return}let xp=2*n+c;S.questions.push({id:id(),d:day(),total:n,correct:c,sid:d.sid,xp});award(xp);break}case 'exam':if(d.name&&d.date)S.exams.push({id:id(),name:d.name,date:d.date,sid:d.sid,done:false});break;case 'reward':if(+d.lvl>=1&&d.text.trim())S.rewards.push({id:id(),lvl:+d.lvl,text:d.text.trim(),claimed:false});break}commit()});quests();save();render()})();
</script></body></html>
